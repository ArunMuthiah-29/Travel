<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Travels</title>
    <link rel="icon" href="./logo 1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <style>
        .one {
            background-color: rgba(8, 1, 1, 0.964);
            padding: 2px;
            margin: 2px;
            border-radius: 8px;
            width: 1500px;
        }

        .for {
            background-color: black;
            padding: 10px;
            border-radius: 7px;
            float: inline-start;
            color: bisque;
            font-size: 29px;
            font-variant: small-caps;
            font-family: cursive;
            margin-top: 12px;
            margin-left: 13px;
            /* position: fixed; */
        }
        .M {
            font-size: 13px;
            text-align: center;
            color: yellow;
            font-style: italic;
            font-variant: normal;
        }
        .two div {
            font-size: 22px;
            /* margin-left: 80px; */
            display: inline-block;
            font-family: 'Times New Roman', Times, serif;
            font-variant: small-caps;
            margin: 19px;
            margin-left: 20px;

        }

        .sticky {
            position: sticky;
            top: 0;
            z-index: 3;
            background-color: rgba(128, 128, 128, 0.76);
        }
        .two div a {
            color: black;
            text-decoration: none;

        }


        .two div:hover {
            background-color: yellow;
            border-radius: 7px;
        }
         .no {
            color: black;
            background-color: yellow;
            font-weight: bolder;
            width: 160px;
            padding-left: 20px;
            height: 25px;
            padding: 20px;
            border: 2px;
            border-radius: 20px;

        }

        .no:hover {
            color: grey;
            border-radius: 35px;
        }
     </style>
</head>

<body>
    <div class="one">
        <a href="https://www.instagram.com/"><i class="fa-brands fa-instagram"
                style="font-size: 26px; color:rgb(252, 4, 45); margin: 10px;"></i></a>
        <a href="https://www.facebook.com/"><i class="fa-brands fa-facebook"
                style="font-size: 26px; color:blue; padding: 10px;">
            </i></a>
        <a href="https://mail.google.com/mail/u/0/#inbox"
            style="color:azure;text-decoration: none;font-size: 19px; padding: 25px;">
            <i class="fas fa-envelope" style="color: bisque; font-size: 20px;"></i>
            astravels.com
        </a>
    </div> <br>
    <div class="sticky">
        <div class="for">AS Travels
            <img src="./logo 1.png" alt="" width="29px" height="28px"> <br>
            <div class="M">

                (Roam, Unity, Discover)
            </div>
        </div>
        <div class="two">
            <div> Home </div>
            <div>Company</div>
            <div>Group tours</div>
            <div> Packages</div>
            <div>Our Map</div>
            <div>Wedding&Honeymoom</div>
            <div> Contact</div>
            <div class="no">+91 7397603995</div>
        </div>

    </div>

</body>

</html>
